<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f2f6fa"/><text x="46" y="54" font-family="Arial" font-size="25" font-weight="700" fill="#182b43">✈ Du lịch · Đặt chỗ của tôi</text><rect x="920" y="25" width="230" height="34" rx="17" fill="#fff3d7"/><text x="946" y="48" font-family="Arial" font-size="13" font-weight="700" fill="#785000">BẢN DÙNG THỬ · DỮ LIỆU DỰNG</text><rect x="40" y="90" width="330" height="620" rx="18" fill="white" stroke="#dce5ef"/><text x="66" y="132" font-family="Arial" font-size="14" fill="#61738a">ĐẶT CHỖ TRV-7Q2K</text><text x="66" y="177" font-family="Arial" font-size="24" font-weight="700" fill="#182b43">Hà Nội → TP.HCM</text><rect x="66" y="196" width="166" height="30" rx="7" fill="#fff0f0"/><text x="77" y="216" font-family="Arial" font-size="13" font-weight="700" fill="#a93232">CHUYẾN GỐC ĐÃ HUỶ</text><text x="66" y="257" font-family="Arial" font-size="15" fill="#61738a">BM 213 · 12/11/2026 · 19:00</text><text x="66" y="282" font-family="Arial" font-size="15" fill="#61738a">Lý do: thời tiết (bão)</text><line x1="66" y1="310" x2="340" y2="310" stroke="#dce5ef"/><text x="66" y="344" font-family="Arial" font-size="13" fill="#61738a">HÀNH KHÁCH</text><text x="66" y="372" font-family="Arial" font-size="15" font-weight="700" fill="#182b43">Nguyễn Minh An · Người lớn</text><text x="66" y="398" font-family="Arial" font-size="15" font-weight="700" fill="#182b43">Nguyễn Gia Bình · 5 tuổi</text><rect x="62" y="432" width="286" height="120" rx="11" fill="#fff8e8" stroke="#f1d89a"/><text x="78" y="461" font-family="Arial" font-size="14" fill="#624b16">Dữ liệu hãng dựng: đổi miễn phí</text><text x="78" y="484" font-family="Arial" font-size="14" fill="#624b16">một lần hoặc hoàn toàn bộ.</text><text x="78" y="507" font-family="Arial" font-size="14" fill="#624b16">Huỷ do thời tiết: không bồi thường.</text><rect x="390" y="90" width="770" height="620" rx="18" fill="white" stroke="#dce5ef"/><text x="420" y="130" font-family="Arial" font-size="19" font-weight="700" fill="#182b43">Trợ lý chuyến bay</text><text x="420" y="153" font-family="Arial" font-size="13" fill="#61738a">Hỗ trợ lựa chọn · chưa đổi hoặc hoàn vé</text><rect x="420" y="175" width="740" height="1" fill="#dce5ef"/><rect x="420" y="194" width="505" height="50" rx="12" fill="#e5f2ff"/><text x="438" y="225" font-family="Arial" font-size="14" fill="#182b43">Đổi giúp hai mẹ con sang chuyến sớm nhất còn chỗ nhé.</text><rect x="420" y="260" width="700" height="100" rx="12" fill="#f1f5f9"/><text x="440" y="289" font-family="Arial" font-size="15" font-weight="700" fill="#182b43">BM 213 đã bị huỷ. BM 217 sớm hơn nhưng chỉ còn 1 chỗ,</text><text x="440" y="314" font-family="Arial" font-size="15" fill="#182b43">không đủ cho hai hành khách. Chưa có vé nào thay đổi.</text><text x="440" y="343" font-family="Arial" font-size="13" fill="#1768ac">Nguồn: TRV-7Q2K · BM 217 = 1 · BM 201 = 9 · BM 205 = 4 chỗ</text><g font-family="Arial"><rect x="420" y="378" width="220" height="152" rx="12" fill="#fafbfc" stroke="#dce5ef"/><text x="438" y="411" font-size="20" font-weight="700" fill="#182b43">21:00 · BM 217</text><text x="438" y="438" font-size="14" fill="#61738a">12/11 · còn 1 chỗ</text><rect x="435" y="462" width="190" height="45" rx="9" fill="#edf0f4"/><text x="450" y="490" font-size="13" fill="#647286">Không đủ chỗ cho 2 người</text><rect x="654" y="378" width="220" height="152" rx="12" fill="white" stroke="#1768ac"/><text x="672" y="411" font-size="20" font-weight="700" fill="#182b43">07:00 · BM 201</text><text x="672" y="438" font-size="14" fill="#61738a">13/11 · còn 9 chỗ</text><rect x="669" y="462" width="190" height="45" rx="9" fill="#1768ac"/><text x="690" y="490" font-size="14" font-weight="700" fill="white">Giữ tạm chuyến này</text><rect x="888" y="378" width="220" height="152" rx="12" fill="white" stroke="#dce5ef"/><text x="906" y="411" font-size="20" font-weight="700" fill="#182b43">09:30 · BM 205</text><text x="906" y="438" font-size="14" fill="#61738a">13/11 · còn 4 chỗ</text><rect x="903" y="462" width="190" height="45" rx="9" fill="#eaf4fc"/><text x="922" y="490" font-size="14" font-weight="700" fill="#1768ac">Giữ tạm chuyến này</text></g><text x="420" y="566" font-family="Arial" font-size="13" fill="#61738a">Giữ chỗ tạm 20 phút; chưa dùng lần đổi miễn phí.</text><rect x="420" y="594" width="172" height="44" rx="10" fill="#eef3f8"/><text x="441" y="622" font-family="Arial" font-size="14" font-weight="700" fill="#182b43">Chuyển nhân viên</text><rect x="603" y="594" width="186" height="44" rx="10" fill="#fff0f0"/><text x="621" y="622" font-family="Arial" font-size="14" font-weight="700" fill="#a93232">Xem lựa chọn hoàn vé</text><text x="420" y="679" font-family="Arial" font-size="12" fill="#61738a">Giờ và số chỗ dựa trên dữ liệu đặt chỗ được hiển thị.</text></svg>


<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f2f6fa"/><rect x="190" y="35" width="820" height="690" rx="18" fill="white" stroke="#dce5ef"/><text x="230" y="83" font-family="Arial" font-size="22" font-weight="700" fill="#182b43">2 · Giữ tạm — bạn duyệt trước khi đổi</text><rect x="230" y="112" width="740" height="60" rx="12" fill="#f1f5f9"/><text x="250" y="149" font-family="Arial" font-size="15" fill="#182b43">Đã giữ tạm BM 201 · 07:00 ngày 13/11 cho An và Bình.</text><text x="230" y="211" font-family="Arial" font-size="14" font-weight="700" fill="#15704c">Chỗ giữ chưa phải vé mới · tự nhả sau 19:42</text><rect x="230" y="239" width="249" height="44" rx="10" fill="#1768ac"/><text x="253" y="267" font-family="Arial" font-size="14" font-weight="700" fill="white">Xem lại và xác nhận đổi</text><rect x="490" y="239" width="160" height="44" rx="10" fill="#eef3f8"/><text x="519" y="267" font-family="Arial" font-size="14" font-weight="700" fill="#182b43">Bỏ giữ chỗ</text><rect x="230" y="324" width="740" height="345" rx="14" fill="#13283a" opacity=".55"/><rect x="330" y="350" width="540" height="295" rx="16" fill="white"/><text x="365" y="395" font-family="Arial" font-size="21" font-weight="700" fill="#182b43">Kiểm tra trước khi đổi</text><text x="365" y="431" font-family="Arial" font-size="15" fill="#61738a">BM 201 · 07:00, ngày 13/11 cho đúng hai hành khách:</text><text x="385" y="465" font-family="Arial" font-size="15" fill="#182b43">• Nguyễn Minh An</text><text x="385" y="491" font-family="Arial" font-size="15" fill="#182b43">• Nguyễn Gia Bình</text><rect x="365" y="510" width="470" height="65" rx="10" fill="#fff4e5" stroke="#eacb8a"/><text x="383" y="537" font-family="Arial" font-size="14" font-weight="700" fill="#875b00">Đổi vé dùng lần đổi miễn phí duy nhất.</text><text x="383" y="559" font-family="Arial" font-size="13" fill="#624b16">Sau khi đổi, lựa chọn này có thể không lấy lại được.</text><rect x="365" y="592" width="220" height="40" rx="9" fill="#1768ac"/><text x="382" y="618" font-family="Arial" font-size="13" font-weight="700" fill="white">Đồng ý đổi vé</text><rect x="594" y="592" width="150" height="40" rx="9" fill="#eef3f8"/><text x="619" y="618" font-family="Arial" font-size="13" font-weight="700" fill="#182b43">Quay lại</text></svg>
